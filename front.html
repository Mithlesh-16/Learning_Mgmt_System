<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LMS Subscription Test</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 35px;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #3399cc;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #287fa8;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Learning Management System</h1>

        <p>Premium Subscription</p>

        <div class="price">
            ₹500 / month
        </div>

        <p>
            Test Razorpay subscription integration.
        </p>

        <button id="pay-button">
            Authenticate ₹500
        </button>

        <div id="status">
            Waiting for payment...
        </div>

    </div>


    <script>

const subscriptionId = "sub_TQbaw7SDWtPZ5s"; // Replace with your actual subscription ID

const razorpayKey = "rzp_test_TNkpa1vmQ0SG9T";


document.getElementById("pay-button").onclick = function () {

    console.log("Button clicked");

    const options = {

        key: razorpayKey,

        subscription_id: subscriptionId,

        name: "Learning Management System",

        description: "Premium Subscription",

        handler: function (response) {

            console.log("========== RAZORPAY RESPONSE ==========");

            console.log(response);

            console.log(
                "Payment ID:",
                response.razorpay_payment_id
            );

            console.log(
                "Subscription ID:",
                response.razorpay_subscription_id
            );

            console.log(
                "Signature:",
                response.razorpay_signature
            );

        },

        modal: {
            ondismiss: function () {
                console.log("Razorpay checkout closed");
            }
        }

    };


    const razorpay = new Razorpay(options);


    razorpay.on("payment.failed", function (response) {

        console.log("========== PAYMENT FAILED ==========");

        console.log(response.error);

    });


    razorpay.open();

};

</script>
</body>

</html>
